// Storm aerie worldgen check on a fresh normal world: runs /locate structure elementalwands:storm_aerie from spawn
// (and seven far points), generates each found aerie and measures the gong, floor, levelling, surface mix, snow on
// stony peaks, the remains, support, biome, walls and overhangs.
// Receipt: build/aerie-worldgen-smoke-run/AERIE_WORLDGEN_PASSED.txt (or _FAILED.txt) with the measurements.
// ./gradlew -I tools/aerie_worldgen_smoke.init.gradle runServer --args nogui      (-PaerieSeed=<seed>, default 12345)
allprojects {
    plugins.withId('fabric-loom') {
        def smokeRoot = layout.buildDirectory.dir('aerie-worldgen-smoke').get().asFile
        def runRoot = file('build/aerie-worldgen-smoke-run')
        tasks.register('aerieWorldgenSmokeSetup') {
            doLast {
                runRoot.mkdirs()
                def oldWorld = new File(runRoot, 'aerie-worldgen')
                if (oldWorld.exists() && !oldWorld.renameTo(new File(runRoot, 'aerie-worldgen-before-' + System.currentTimeMillis()))) {
                    throw new GradleException('Could not preserve the previous disposable test world.')
                }
                def acceptedEula = file('run/eula.txt')
                if (!acceptedEula.exists() || !acceptedEula.text.contains('eula=true')) {
                    throw new GradleException('Accept the Minecraft EULA in run/eula.txt before using this test server.')
                }
                new File(runRoot, 'eula.txt').text = acceptedEula.text
                new File(runRoot, 'server.properties').text = '''server-ip=127.0.0.1
server-port=0
online-mode=false
level-type=minecraft:normal
level-seed=AERIE_SEED
level-name=aerie-worldgen
spawn-protection=0
view-distance=6
simulation-distance=6
difficulty=normal
max-tick-time=-1
pause-when-empty-seconds=0
'''.replace('AERIE_SEED', providers.gradleProperty('aerieSeed').getOrElse('12345'))
                new File(runRoot,'AERIE_WORLDGEN_FAILED.txt').delete()
                new File(runRoot,'AERIE_WORLDGEN_PASSED.txt').delete()
            }
        }
        tasks.register('aerieWorldgenSmokeMetadata') {
            doLast {
                def metadata = new File(smokeRoot,'metadata')
                metadata.mkdirs()
                new File(metadata,'fabric.mod.json').text = '''{
  "schemaVersion": 1, "id": "aerie_worldgen_smoke", "version": "1.0.0", "environment": "server",
  "entrypoints": {"main": ["com.anton.elementalwands.summit.StormAerieWorldgenSmoke"]},
  "depends": {"elementalwands": "*"}
}'''
            }
        }
        tasks.register('aerieWorldgenSmokeJar', Jar) {
            dependsOn guardianTestClasses, aerieWorldgenSmokeMetadata
            archiveFileName = 'aerie-worldgen-smoke.jar'
            destinationDirectory = smokeRoot
            from sourceSets.guardianTest.output
            from new File(smokeRoot,'metadata')
        }
        loom.runs.server.runDir('build/aerie-worldgen-smoke-run')
        loom.runs.server.vmArg('-Dfabric.addMods=' + new File(smokeRoot,'aerie-worldgen-smoke.jar').absolutePath)
        tasks.named('runServer') {
            dependsOn aerieWorldgenSmokeJar, aerieWorldgenSmokeSetup
            standardInput = System.in
            doLast {
                def marker = new File(runRoot,'AERIE_WORLDGEN_PASSED.txt')
                if (!marker.exists() || new File(runRoot,'AERIE_WORLDGEN_FAILED.txt').exists()) {
                    throw new GradleException('Storm aerie worldgen checks did not pass; inspect build/aerie-worldgen-smoke-run/AERIE_WORLDGEN_*.txt and logs/latest.log')
                }
            }
        }
    }
}
