// The Pyre King's intro in a disposable integrated world: /ew hall enter, /ew pyreking intro, the whole scene through its own camera, then again skipped; hidden, muted window.
// ./gradlew -I tools/pyre_king_intro_smoke.init.gradle runClient -PhubClientAssets="$HOME/.lunarclient/shared/assets" [-PpyreIntroVideo] [-PpyreIntroEvery=1]
allprojects {
    plugins.withId('fabric-loom') {
        def smokeRoot=layout.buildDirectory.dir('pyre-king-intro-smoke').get().asFile
        // Optional existing cache for offline verification (for example Lunar shared/assets).
        def existingAssets=project.findProperty('hubClientAssets')
        if (existingAssets) {
            loom.runs.client.vmArg('-Dfabric.dli.config='+new File(smokeRoot,'launch.cfg').absolutePath)
        }
        tasks.register('pyreKingIntroMetadata') {
            if (existingAssets) dependsOn generateDLIConfig
            doLast {
                def metadata=new File(smokeRoot,'metadata')
                metadata.mkdirs()
                new File(metadata,'fabric.mod.json').text='''{
  "schemaVersion": 1, "id": "pyre_king_intro_smoke", "version": "1.0.0", "environment": "client",
  "entrypoints": {"client": ["com.anton.elementalwands.client.PyreKingIntroSmoke"]},
  "depends": {"elementalwands": "*"}
}'''
                // Muted from the first frame: the fixture also sets master volume to zero before it loads a world.
                def options=new File(smokeRoot,'options.txt')
                def lines=options.exists() ? options.readLines().findAll { !it.startsWith('soundCategory_master:') && !it.startsWith('narrator:') } : []
                options.text=(lines+['soundCategory_master:0.0','narrator:0']).join('\n')+'\n'
                new File(smokeRoot,'PYRE_KING_INTRO_PASSED.txt').delete()
                new File(smokeRoot,'PYRE_KING_INTRO_FAILED.txt').delete()
                if (existingAssets) {
                    def assets=file(existingAssets)
                    if (!new File(assets,'indexes/27.json').exists()) throw new GradleException('Existing asset cache needs indexes/27.json')
                    def launch=file('.gradle/loom-cache/launch.cfg').text
                    launch=launch.replaceAll(/(?m)(\t--assetIndex\r?\n)\t[^\r\n]+/, { match, prefix -> prefix+'\t27' })
                    launch=launch.replaceAll(/(?m)(\t--assetsDir\r?\n)\t[^\r\n]+/, { match, prefix -> prefix+'\t'+assets.absolutePath })
                    new File(smokeRoot,'launch.cfg').text=launch
                }
            }
        }
        // -PpyreIntroVideo: also save a frame every other tick (screenshots/intro-*.png), for a review clip;
        // -PpyreIntroEvery=1 saves every tick instead, for judging a fast move.
        if (project.hasProperty('pyreIntroVideo') || project.hasProperty('pyreIntroEvery'))
            loom.runs.client.vmArg('-DpyreIntroEvery=' + (project.findProperty('pyreIntroEvery') ?: '2'))
        tasks.register('pyreKingIntroJar',Jar) {
            dependsOn guardianTestClasses, pyreKingIntroMetadata
            archiveFileName='pyre-king-intro-smoke.jar'
            destinationDirectory=smokeRoot
            from sourceSets.guardianTest.output
            from new File(smokeRoot,'metadata')
        }
        loom.runs.client.runDir('build/pyre-king-intro-smoke')
        loom.runs.client.vmArg('-Dfabric.addMods='+new File(smokeRoot,'pyre-king-intro-smoke.jar').absolutePath)
        tasks.named('runClient') {
            dependsOn pyreKingIntroJar
            doLast {
                if (!new File(smokeRoot,'PYRE_KING_INTRO_PASSED.txt').exists() || new File(smokeRoot,'PYRE_KING_INTRO_FAILED.txt').exists())
                    throw new GradleException('Pyre King intro check failed; inspect build/pyre-king-intro-smoke/logs/latest.log')
            }
        }
    }
}
