// Native screenshots of the five Space spells drawn as void glass, in a disposable integrated world; hidden window, muted.
// ./gradlew -I tools/space_blockspace_client_smoke.init.gradle runClient -PhubClientAssets="$HOME/.lunarclient/shared/assets" --offline
allprojects {
    plugins.withId('fabric-loom') {
        def smokeRoot=layout.buildDirectory.dir('blockspace-client-smoke').get().asFile
        // Optional existing cache for offline verification (for example Lunar shared/assets).
        def existingAssets=project.findProperty('hubClientAssets')
        if (existingAssets) {
            loom.runs.client.vmArg('-Dfabric.dli.config='+new File(smokeRoot,'launch.cfg').absolutePath)
        }
        tasks.register('blockspaceClientMetadata') {
            if (existingAssets) dependsOn generateDLIConfig
            doLast {
                def metadata=new File(smokeRoot,'metadata')
                metadata.mkdirs()
                new File(metadata,'fabric.mod.json').text='''{
  "schemaVersion": 1, "id": "blockspace_client_smoke", "version": "1.0.0", "environment": "client",
  "entrypoints": {"client": ["com.anton.elementalwands.client.SpaceBlockSpaceClientSmoke"]},
  "depends": {"elementalwands": "*"}
}'''
                new File(smokeRoot,'BLOCKSPACE_CLIENT_PASSED.txt').delete()
                new File(smokeRoot,'BLOCKSPACE_CLIENT_FAILED.txt').delete()
                if (existingAssets) {
                    def assets=file(existingAssets)
                    if (!new File(assets,'indexes/27.json').exists()) throw new GradleException('Existing asset cache needs indexes/27.json')
                    def launch=file('.gradle/loom-cache/launch.cfg').text
                    launch=launch.replaceAll(/(?m)(\t--assetIndex\r?\n)\t[^\r\n]+/, { match, prefix -> prefix+'\t27' })
                    launch=launch.replaceAll(/(?m)(\t--assetsDir\r?\n)\t[^\r\n]+/, { match, prefix -> prefix+'\t'+assets.absolutePath })
                    new File(smokeRoot,'launch.cfg').text=launch
                }
            }
        }
        tasks.register('blockspaceClientJar',Jar) {
            dependsOn guardianTestClasses, blockspaceClientMetadata
            archiveFileName='blockspace-client-smoke.jar'
            destinationDirectory=smokeRoot
            from sourceSets.guardianTest.output
            from new File(smokeRoot,'metadata')
        }
        loom.runs.client.runDir('build/blockspace-client-smoke')
        loom.runs.client.vmArg('-Dfabric.addMods='+new File(smokeRoot,'blockspace-client-smoke.jar').absolutePath)
        tasks.named('runClient') {
            dependsOn blockspaceClientJar
            doLast {
                if (!new File(smokeRoot,'BLOCKSPACE_CLIENT_PASSED.txt').exists() || new File(smokeRoot,'BLOCKSPACE_CLIENT_FAILED.txt').exists())
                    throw new GradleException('Block space client check failed; inspect build/blockspace-client-smoke/logs/latest.log')
            }
        }
    }
}
