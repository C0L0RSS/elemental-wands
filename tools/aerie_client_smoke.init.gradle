// Native look at naturally generated Storm aeries and at the gong in all four rotations (hidden, muted window).
// Use the seed and gong anchors that tools/aerie_worldgen_smoke.init.gradle reported, each with a label for its
// screenshots. Each run creates a fresh world. Screenshots: build/aerie-client-smoke/screenshots/
// ./gradlew -I tools/aerie_client_smoke.init.gradle runClient -PaerieSeed=12345 -PaerieGongs="snowy@x,y,z;stony@x,y,z" -PhubClientAssets="$HOME/.lunarclient/shared/assets" --offline
allprojects {
    plugins.withId('fabric-loom') {
        def smokeRoot=layout.buildDirectory.dir('aerie-client-smoke').get().asFile
        // Optional existing cache for offline verification (for example Lunar shared/assets).
        def existingAssets=project.findProperty('hubClientAssets')
        if (existingAssets) {
            loom.runs.client.vmArg('-Dfabric.dli.config='+new File(smokeRoot,'launch.cfg').absolutePath)
        }
        loom.runs.client.vmArg('-Daerie.seed='+(project.findProperty('aerieSeed') ?: '12345'))
        loom.runs.client.vmArg('-Daerie.gongs='+(project.findProperty('aerieGongs') ?: ''))
        tasks.register('aerieClientMetadata') {
            if (existingAssets) dependsOn generateDLIConfig
            doLast {
                def metadata=new File(smokeRoot,'metadata')
                metadata.mkdirs()
                new File(metadata,'fabric.mod.json').text='''{
  "schemaVersion": 1, "id": "aerie_client_smoke", "version": "1.0.0", "environment": "client",
  "entrypoints": {"client": ["com.anton.elementalwands.client.AerieClientSmoke"]},
  "depends": {"elementalwands": "*"}
}'''
                new File(smokeRoot,'AERIE_CLIENT_PASSED.txt').delete()
                new File(smokeRoot,'AERIE_CLIENT_FAILED.txt').delete()
                // The disposable client starts silent with the narrator off, before any world loads.
                def options=new File(smokeRoot,'options.txt')
                def kept=options.exists() ? options.readLines().findAll { !(it.startsWith('soundCategory_master:') || it.startsWith('narrator:') || it.startsWith('onboardAccessibility:')) } : []
                options.text=(kept+['soundCategory_master:0.0','narrator:0','onboardAccessibility:false']).join('\n')+'\n'
                if (existingAssets) {
                    def assets=file(existingAssets)
                    if (!new File(assets,'indexes/27.json').exists()) throw new GradleException('Existing asset cache needs indexes/27.json')
                    def launch=file('.gradle/loom-cache/launch.cfg').text
                    launch=launch.replaceAll(/(?m)(\t--assetIndex\r?\n)\t[^\r\n]+/, { match, prefix -> prefix+'\t27' })
                    launch=launch.replaceAll(/(?m)(\t--assetsDir\r?\n)\t[^\r\n]+/, { match, prefix -> prefix+'\t'+assets.absolutePath })
                    new File(smokeRoot,'launch.cfg').text=launch
                }
            }
        }
        tasks.register('aerieClientJar',Jar) {
            dependsOn guardianTestClasses, aerieClientMetadata
            archiveFileName='aerie-client-smoke.jar'
            destinationDirectory=smokeRoot
            from sourceSets.guardianTest.output
            from new File(smokeRoot,'metadata')
        }
        loom.runs.client.runDir('build/aerie-client-smoke')
        loom.runs.client.vmArg('-Dfabric.addMods='+new File(smokeRoot,'aerie-client-smoke.jar').absolutePath)
        tasks.named('runClient') {
            dependsOn aerieClientJar
            doLast {
                if (!new File(smokeRoot,'AERIE_CLIENT_PASSED.txt').exists() || new File(smokeRoot,'AERIE_CLIENT_FAILED.txt').exists())
                    throw new GradleException('Aerie client check failed; inspect build/aerie-client-smoke/logs/latest.log')
            }
        }
    }
}
