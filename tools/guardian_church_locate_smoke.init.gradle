// Optional real-server regression fixture. All worlds, players and metadata stay under build/.
// ./gradlew -I tools/guardian_church_locate_smoke.init.gradle runServer --args nogui
// Pass -PchurchSeed=<seed> to exercise another fresh normal world.
allprojects {
    plugins.withId('fabric-loom') {
        def smokeRoot = layout.buildDirectory.dir('church-locate-smoke').get().asFile
        def runRoot = file('build/church-locate-smoke-run')
        tasks.register('churchLocateSmokeSetup') {
            doLast {
                runRoot.mkdirs()
                def oldWorld = new File(runRoot, 'church-locate-v3')
                if (oldWorld.exists() && !oldWorld.renameTo(new File(runRoot, 'church-locate-v3-before-' + System.currentTimeMillis()))) {
                    throw new GradleException('Could not preserve the previous disposable test world.')
                }
                def acceptedEula = file('run/eula.txt')
                if (!acceptedEula.exists() || !acceptedEula.text.contains('eula=true')) {
                    throw new GradleException('Accept the Minecraft EULA in run/eula.txt before using this test server.')
                }
                new File(runRoot, 'eula.txt').text = acceptedEula.text
                new File(runRoot, 'server.properties').text = '''server-ip=127.0.0.1
server-port=0
online-mode=false
level-type=minecraft:normal
level-seed=LOCATE_SEED
level-name=church-locate-v3
spawn-protection=0
view-distance=8
simulation-distance=8
difficulty=normal
max-tick-time=10000
pause-when-empty-seconds=0
'''.replace('LOCATE_SEED', providers.gradleProperty('churchSeed').getOrElse('12345'))
                new File(runRoot,'LOCATE_FAILED.txt').delete()
                new File(runRoot,'LOCATE_PASSED.txt').delete()
            }
        }
        tasks.register('churchLocateSmokeMetadata') {
            doLast {
                def metadata = new File(smokeRoot,'metadata')
                metadata.mkdirs()
                new File(metadata,'fabric.mod.json').text = '''{
  "schemaVersion": 1, "id": "guardian_church_smoke", "version": "1.0.0", "environment": "server",
  "entrypoints": {"main": ["com.anton.elementalwands.church.GuardianChurchLocateSmokeMod"]},
  "depends": {"elementalwands": "*"}
}'''
            }
        }
        tasks.register('churchLocateSmokeJar', Jar) {
            dependsOn guardianTestClasses, churchLocateSmokeMetadata
            archiveFileName = 'church-locate-smoke.jar'
            destinationDirectory = smokeRoot
            from sourceSets.guardianTest.output
            from new File(smokeRoot,'metadata')
        }
        loom.runs.server.runDir('build/church-locate-smoke-run')
        loom.runs.server.vmArg('-Dfabric.addMods=' + new File(smokeRoot,'church-locate-smoke.jar').absolutePath)
        tasks.named('runServer') {
            dependsOn churchLocateSmokeJar, churchLocateSmokeSetup
            standardInput = System.in
            doLast {
                def marker = new File(runRoot,'LOCATE_PASSED.txt')
                if (!marker.exists() || new File(runRoot,'LOCATE_FAILED.txt').exists()) {
                    throw new GradleException('Church runtime checks did not pass; inspect build/church-locate-smoke-run/logs/latest.log')
                }
            }
        }
    }
}
