// Optional real-server regression fixture. All worlds, players and metadata stay under build/.
// ./gradlew -I tools/guardian_church_smoke.init.gradle runServer --args nogui
// ./gradlew -I tools/guardian_church_smoke.init.gradle -PchurchRecovery runServer --args nogui
allprojects {
    plugins.withId('fabric-loom') {
        def smokeRoot = layout.buildDirectory.dir('church-worldgen-smoke').get().asFile
        def runRoot = file('build/church-worldgen-smoke-run')
        def recovery = project.hasProperty('churchRecovery')
        tasks.register('churchWorldgenSmokeSetup') {
            doLast {
                runRoot.mkdirs()
                def oldWorld = new File(runRoot, 'church-worldgen-v3')
                if (!recovery && oldWorld.exists() && !oldWorld.renameTo(new File(runRoot, 'church-worldgen-v3-before-' + System.currentTimeMillis()))) {
                    throw new GradleException('Could not preserve the previous disposable test world.')
                }
                def acceptedEula = file('run/eula.txt')
                if (!acceptedEula.exists() || !acceptedEula.text.contains('eula=true')) {
                    throw new GradleException('Accept the Minecraft EULA in run/eula.txt before using this test server.')
                }
                new File(runRoot, 'eula.txt').text = acceptedEula.text
                new File(runRoot, 'server.properties').text = '''server-ip=127.0.0.1
server-port=0
online-mode=false
level-type=minecraft:normal
level-seed=12345
level-name=church-worldgen-v3
spawn-protection=0
view-distance=8
simulation-distance=8
difficulty=normal
max-tick-time=-1
'''
                new File(runRoot,'WORLDGEN_FAILED.txt').delete()
                new File(runRoot,'WORLDGEN_PASSED.txt').delete()
            }
        }
        tasks.register('churchWorldgenSmokeMetadata') {
            doLast {
                def metadata = new File(smokeRoot,'metadata')
                metadata.mkdirs()
                new File(metadata,'fabric.mod.json').text = '''{
  "schemaVersion": 1, "id": "guardian_church_smoke", "version": "1.0.0", "environment": "server",
  "entrypoints": {"main": ["com.anton.elementalwands.church.GuardianChurchWorldgenSmokeMod"]},
  "depends": {"elementalwands": "*"}
}'''
            }
        }
        tasks.register('churchWorldgenSmokeJar', Jar) {
            dependsOn guardianTestClasses, churchWorldgenSmokeMetadata
            archiveFileName = 'church-worldgen-smoke.jar'
            destinationDirectory = smokeRoot
            from sourceSets.guardianTest.output
            from new File(smokeRoot,'metadata')
        }
        loom.runs.server.runDir('build/church-worldgen-smoke-run')
        loom.runs.server.vmArg('-Dfabric.addMods=' + new File(smokeRoot,'church-worldgen-smoke.jar').absolutePath)
        loom.runs.server.vmArg('-Dew.church.recovery=' + recovery)
        loom.runs.server.vmArg('-Dew.church.placement.debug=true')
        tasks.named('runServer') {
            dependsOn churchWorldgenSmokeJar, churchWorldgenSmokeSetup
            standardInput = System.in
            doLast {
                def marker = new File(runRoot,'WORLDGEN_PASSED.txt')
                if (!marker.exists() || new File(runRoot,'WORLDGEN_FAILED.txt').exists()) {
                    throw new GradleException('Church runtime checks did not pass; inspect build/church-worldgen-smoke-run/logs/latest.log')
                }
            }
        }
    }
}
