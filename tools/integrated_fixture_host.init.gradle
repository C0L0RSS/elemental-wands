// Runs a dedicated-server fixture inside a muted singleplayer world, for a machine with no
// accepted run/eula.txt. Name the fixture's entrypoint class and the prefix of its receipt:
// ./gradlew -I tools/integrated_fixture_host.init.gradle runClient -x downloadAssets \
//   -PfixtureMain=com.anton.elementalwands.entity.NatureBalanceSmokeMod -PfixtureReceipt=NATURE \
//   -PhubClientAssets="$HOME/.lunarclient/shared/assets"
// A fixture that needs the flat test world, a restart or dedicated-server settings still needs
// its own runner; a pass here is a pass of the fixture's assertions in an ordinary world.
allprojects {
    plugins.withId('fabric-loom') {
        def smokeRoot=layout.buildDirectory.dir('integrated-fixture-host').get().asFile
        def fixtureMain=project.findProperty('fixtureMain')
        def receipt=project.findProperty('fixtureReceipt') ?: 'NATURE'
        def existingAssets=project.findProperty('hubClientAssets')
        if (existingAssets) {
            loom.runs.client.vmArg('-Dfabric.dli.config='+new File(smokeRoot,'launch.cfg').absolutePath)
        }
        tasks.register('fixtureHostMetadata') {
            inputs.property('fixtureMain', fixtureMain ?: '')
            if (existingAssets) dependsOn generateDLIConfig
            doLast {
                if (!fixtureMain) throw new GradleException('Pass -PfixtureMain=<server fixture entrypoint class>')
                def metadata=new File(smokeRoot,'metadata')
                metadata.mkdirs()
                new File(metadata,'fabric.mod.json').text="""{
  "schemaVersion": 1, "id": "integrated_fixture_host", "version": "1.0.0", "environment": "client",
  "entrypoints": {"main": ["${fixtureMain}"], "client": ["com.anton.elementalwands.client.IntegratedFixtureHost"]},
  "depends": {"elementalwands": "*"}
}"""
                new File(smokeRoot,receipt+'_PASSED.txt').delete()
                new File(smokeRoot,receipt+'_FAILED.txt').delete()
                // The disposable client starts silent with the narrator off, before any world loads.
                def options=new File(smokeRoot,'options.txt')
                def kept=options.exists() ? options.readLines().findAll { !(it.startsWith('soundCategory_master:') || it.startsWith('narrator:') || it.startsWith('onboardAccessibility:')) } : []
                options.text=(kept+['soundCategory_master:0.0','narrator:0','onboardAccessibility:false']).join('\n')+'\n'
                if (existingAssets) {
                    def assets=file(existingAssets)
                    if (!new File(assets,'indexes/27.json').exists()) throw new GradleException('Existing asset cache needs indexes/27.json')
                    def launch=file('.gradle/loom-cache/launch.cfg').text
                    launch=launch.replaceAll(/(?m)(\t--assetIndex\r?\n)\t[^\r\n]+/, { match, prefix -> prefix+'\t27' })
                    launch=launch.replaceAll(/(?m)(\t--assetsDir\r?\n)\t[^\r\n]+/, { match, prefix -> prefix+'\t'+assets.absolutePath })
                    new File(smokeRoot,'launch.cfg').text=launch
                }
            }
        }
        tasks.register('fixtureHostJar',Jar) {
            inputs.property('fixtureMain', fixtureMain ?: '')
            dependsOn guardianTestClasses, fixtureHostMetadata
            archiveFileName='integrated-fixture-host.jar'
            destinationDirectory=smokeRoot
            from sourceSets.guardianTest.output
            from new File(smokeRoot,'metadata')
        }
        loom.runs.client.runDir('build/integrated-fixture-host')
        loom.runs.client.vmArg('-Dfabric.addMods='+new File(smokeRoot,'integrated-fixture-host.jar').absolutePath)
        loom.runs.client.vmArg('-Dew.fixture.receipt='+receipt)
        tasks.named('runClient') {
            dependsOn fixtureHostJar
            doLast {
                if (!new File(smokeRoot,receipt+'_PASSED.txt').exists() || new File(smokeRoot,receipt+'_FAILED.txt').exists())
                    throw new GradleException('Hosted fixture did not pass; inspect build/integrated-fixture-host/logs/latest.log')
            }
        }
    }
}
