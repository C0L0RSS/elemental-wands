// Actual Fire Leap flight, preview and input checks in a disposable integrated world.
// ./gradlew -I tools/sticky_flashover_client_smoke.init.gradle runClient
allprojects {
    plugins.withId('fabric-loom') {
        def smokeRoot=layout.buildDirectory.dir('sticky-flashover-client-smoke').get().asFile
        // Optional existing cache for offline verification (for example Lunar shared/assets).
        def existingAssets=project.findProperty('hubClientAssets')
        if (existingAssets) {
            loom.runs.client.vmArg('-Dfabric.dli.config='+new File(smokeRoot,'launch.cfg').absolutePath)
        }
        tasks.register('hubClientMetadata') {
            if (existingAssets) dependsOn generateDLIConfig
            doLast {
                def metadata=new File(smokeRoot,'metadata')
                metadata.mkdirs()
                new File(metadata,'fabric.mod.json').text='''{
  "schemaVersion": 1, "id": "sticky_flashover_client_smoke", "version": "1.0.0", "environment": "client",
  "entrypoints": {"client": ["com.anton.elementalwands.client.StickyFlashoverClientSmoke"]},
  "depends": {"elementalwands": "*"}
}'''
                new File(smokeRoot,'HUB_PASSED.txt').delete()
                new File(smokeRoot,'HUB_FAILED.txt').delete()
                if (existingAssets) {
                    def assets=file(existingAssets)
                    if (!new File(assets,'indexes/27.json').exists()) throw new GradleException('Existing asset cache needs indexes/27.json')
                    def launch=file('.gradle/loom-cache/launch.cfg').text
                    launch=launch.replaceAll(/(?m)(\t--assetIndex\r?\n)\t[^\r\n]+/, { match, prefix -> prefix+'\t27' })
                    launch=launch.replaceAll(/(?m)(\t--assetsDir\r?\n)\t[^\r\n]+/, { match, prefix -> prefix+'\t'+assets.absolutePath })
                    new File(smokeRoot,'launch.cfg').text=launch
                }
            }
        }
        tasks.register('hubClientJar',Jar) {
            dependsOn guardianTestClasses, hubClientMetadata
            archiveFileName='sticky-flashover-client-smoke.jar'
            destinationDirectory=smokeRoot
            from sourceSets.guardianTest.output
            from new File(smokeRoot,'metadata')
        }
        loom.runs.client.runDir('build/sticky-flashover-client-smoke')
        loom.runs.client.vmArg('-Dfabric.addMods='+new File(smokeRoot,'sticky-flashover-client-smoke.jar').absolutePath)
        tasks.named('runClient') {
            dependsOn hubClientJar
            doLast {
                if (!new File(smokeRoot,'HUB_PASSED.txt').exists() || new File(smokeRoot,'HUB_FAILED.txt').exists())
                    throw new GradleException('Hub client check failed; inspect build/sticky-flashover-client-smoke/logs/latest.log')
            }
        }
    }
}
