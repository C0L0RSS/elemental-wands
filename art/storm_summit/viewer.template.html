<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storm Summit Preview</title>
<style>
  :root { --panel: rgba(14, 22, 34, .82); --ink: #e4ecf5; --muted: #93a3b8; --accent: #ffd877; --line: #2a3a50; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #8fb8e8; color: var(--ink); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #panel { position: fixed; top: 12px; left: 12px; width: 320px; max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; backdrop-filter: blur(6px); }
  h1 { font-size: 17px; margin: 0 0 2px; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .group { margin: 12px 0 4px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button { background: #1a2638; color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 6px 9px; cursor: pointer; font: inherit; font-size: 12.5px; }
  button:hover { border-color: #47607f; }
  button.on { border-color: var(--accent); color: var(--accent); }
  label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin: 6px 0; }
  label input[type=range] { flex: 1; }
  .facts { font-size: 12px; color: var(--muted); margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  .facts b { color: var(--ink); font-weight: 600; }
  .facts table { border-collapse: collapse; margin: 6px 0; width: 100%; }
  .facts td { padding: 1px 6px 1px 0; }
  #hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; font-size: 12px; color: var(--muted); pointer-events: none; white-space: nowrap; }
  #toggle { display: none; }
  @media (max-width: 640px) {
    #panel { width: auto; right: 12px; max-height: 45vh; }
    #panel.collapsed > :not(#toggle):not(h1) { display: none; }
    #toggle { display: inline-block; position: absolute; top: 10px; right: 10px; }
    #hint { white-space: normal; width: calc(100vw - 24px); text-align: center; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="panel">
  <button id="toggle">Hide</button>
  <h1>Storm Summit</h1>
  <div class="sub">The Storm Roc's realm. Block layout preview; the sea of clouds is a mod effect, and Minecraft does the real lighting.</div>
  <div class="group">Viewpoint</div>
  <div class="row" id="views"></div>
  <div class="group">Storm Roc for scale</div>
  <div class="row" id="rocs"></div>
  <label>Size <input id="rocSize" type="range" min="1" max="3.5" step="0.25" value="2.5"><span id="rocSizeV"></span></label>
  <div class="sub" id="rocStats"></div>
  <label>Render distance <input id="fog" type="range" min="96" max="512" step="16" value="192"><span id="fogv"></span></label>
  <label><input id="clouds" type="checkbox" checked> Sea of clouds (mod effect)</label>
  <label><input id="drift" type="checkbox" checked> Clouds drift</label>
  <label><input id="player" type="checkbox" checked> Show player at the arrival point</label>
  <div class="facts" id="facts"></div>
</div>
<div id="hint"></div>
<script src="viewer.js"></script>
</body>
</html>
